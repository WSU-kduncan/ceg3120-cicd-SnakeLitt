name: Docker Tags

# 1. TRIGGER: Only run on a tag push (e.g., v1.0.0, v2.1.3)
on:
  push:
    tags:
      - 'v*' # Match tags starting with 'v' (common practice for versions)

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Needed to check out the repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        # Fetch depth 0 is recommended for metadata action to properly analyze tags
        with:
          fetch-depth: 0

      # 2. METADATA: Extract tags and labels from Git ref/tag
      - name: Docker meta
        id: meta # Give the step an ID to reference its outputs
        uses: docker/metadata-action@v5
        with:
          # Define the image name on DockerHub
          images: snakelitt/angular-app-server
          # Configure tag extraction based on SemVer
          # Enables SemVer compatibility (handles v prefix automatically)
          tags: |
            type=semver,pattern={{version}} # Extracts the full version tag (e.g., 3.8.1 from v3.8.1) - Good practice
            type=semver,pattern={{major}}.{{minor}} # Extracts major.minor (e.g., 3.8 from v3.8.1) - As requested
            type=semver,pattern={{major}} # Extracts major (e.g., 3 from v3.8.1) - As requested
            type=raw,value=latest # Always tags the pushed version as 'latest' - As requested

      # 3. LOGIN: Authenticate with DockerHub using secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }} # Use a DockerHub Access Token here

      # 4. BUILD & PUSH: Build the image and push to DockerHub with generated tags
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: . # Assumes Dockerfile is in the root directory
          push: true # Actually push the image
          tags: ${{ steps.meta.outputs.tags }} # Use tags generated by the 'meta' step
          labels: ${{ steps.meta.outputs.labels }} # Include labels generated by the 'meta' step (e.g., git sha)
